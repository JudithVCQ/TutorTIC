server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;

        # --- Security Headers (DevSecOps Best Practices) ---
        
        # Prevent Clickjacking attacks
        add_header X-Frame-Options "DENY" always;
        
        # Prevent MIME-sniffing
        add_header X-Content-Type-Options "nosniff" always;
        
        # Control referrer information sent with requests
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        
        # Enable Browser XSS filtering
        add_header X-XSS-Protection "1; mode=block" always;
        
        # Content Security Policy (CSP)
        # Note: Allows connecting to localhost:3000 for local testing. Adjust in production.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' http://localhost:3000; img-src 'self' data:; frame-ancestors 'none';" always;
        
        # Disable permission features
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    }

    # Error pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
